<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贰叁收银台</title>
<script src="https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#f3f4f6;padding:20px}
.wrap{max-width:420px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px #00000015}
.head{background:#2563eb;color:#fff;text-align:center;padding:18px;font-size:20px;font-weight:bold}
.body-inner{padding:24px}
.item{margin-bottom:18px}
label{display:block;margin-bottom:8px;color:#374151;font-size:14px}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
.pay-type-box{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}
.pay-item{border:1px solid #ddd;border-radius:8px;text-align:center;padding:12px;cursor:pointer}
.pay-item.active{border-color:#2563eb;background:#eff6ff}
.btn-submit{width:100%;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:14px;font-size:16px;margin-top:10px;cursor:pointer}
.tip{margin-top:14px;color:#ef4444;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
    <div class="head">贰叁收银台</div>
    <div class="body-inner">
        <div class="item">
            <label>商品名称</label>
            <input id="name" value="贰叁网络收银台收款" type="text" readonly>
        </div>
        <div class="item">
            <label>支付金额(元)</label>
            <input id="money" value="1.00" type="number" step="0.01">
        </div>
        <div class="item">
            <label>选择支付方式</label>
            <div class="pay-type-box">
                <div class="pay-item" data-type="alipay">支付宝</div>
                <div class="pay-item" data-type="wxpay">微信支付</div>
                <div class="pay-item" data-type="qqpay">QQ钱包</div>
            </div>
            <input type="hidden" id="paytype" value="">
        </div>
        <button class="btn-submit" id="payBtn">去支付</button>
    </div>
</div>

<script>
const pid = "88932";
const key = "7CCO0z9l49lCleM4c5K9Y5Cc97Cy9y9v";
const NOTIFY_URL = "https://api.xn--6krw8b915a62m.xn--io0a7i/notify_url.php";
const RETURN_URL = "https://api.xn--6krw8b915a62m.xn--io0a7i/return_url.php";
const baseUrl = "https://api.xn--6krw8b915a62m.xn--io0a7i/submit.php";

const payItems = document.querySelectorAll(".pay-item");
payItems.forEach(el=>{
    el.onclick = ()=>{
        payItems.forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        document.getElementById("paytype").value = el.dataset.type;
    }
})

function createOrderNo(){
    let d = new Date();
    let s = d.getFullYear().toString()
        + (d.getMonth()+1).toString().padStart(2,'0')
        + d.getDate().toString().padStart(2,'0')
        + d.getHours().toString().padStart(2,'0')
        + d.getMinutes().toString().padStart(2,'0')
        + d.getSeconds().toString().padStart(2,'0');
    let r = Math.floor(Math.random()*10000).toString().padStart(4,'0');
    return s + r;
}

document.getElementById("payBtn").onclick = function(){
    const type = document.getElementById("paytype").value;
    if(!type){
        alert("请选择支付方式！");
        return;
    }
    const out_trade_no = createOrderNo();
    const name = document.getElementById("name").value.trim();
    const money = document.getElementById("money").value.trim();

    let signObj = {};
    signObj['name'] = name;
    signObj['notify_url'] = NOTIFY_URL;
    signObj['out_trade_no'] = out_trade_no;
    signObj['pid'] = pid;
    signObj['return_url'] = RETURN_URL;
    signObj['type'] = type;
    signObj['money'] = money;

    let keys = Object.keys(signObj).sort();
    let signStr = "";
    keys.forEach(k=>{
        signStr += k + "=" + signObj[k] + "&";
    })
    signStr = signStr.slice(0,-1);
    signStr = signStr + key;
    let sign = md5(signStr).toLowerCase();

    // 拼接GET链接
    const params = new URLSearchParams();
    params.append("pid", pid);
    params.append("type", type);
    params.append("out_trade_no", out_trade_no);
    params.append("notify_url", NOTIFY_URL);
    params.append("return_url", RETURN_URL);
    params.append("name", name);
    params.append("money", money);
    params.append("sign", sign);
    params.append("sign_type", "MD5");

    const payLink = baseUrl + "?" + params.toString();
    // 直接跳转打开支付链接
    window.location.href = payLink;
}
</script>
</body>
</html>
